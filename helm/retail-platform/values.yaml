global:
  environment: production
  awsRegion: us-east-1
  ecrRegistry: 592306540354.dkr.ecr.us-east-1.amazonaws.com
  tag: latest

apiGateway:
  replicaCount: 2
  image:
    repository: retail/api-gateway
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi

productService:
  replicaCount: 2
  image:
    repository: retail/product-service
  service:
    type: ClusterIP
    port: 8081
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1024Mi

cartService:
  replicaCount: 2
  image:
    repository: retail/cart-service
  service:
    type: ClusterIP
    port: 8082
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi

orderService:
  replicaCount: 2
  image:
    repository: retail/order-service
  service:
    type: ClusterIP
    port: 8083
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1024Mi

frontend:
  replicaCount: 2
  image:
    repository: retail/frontend
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

ingress:
  enabled: true
  host: retail.yourdomain.com
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
