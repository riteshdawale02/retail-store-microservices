global:
  environment: production
  awsRegion: us-east-1
  awsAccountId: "592306540354" # Set your 12-digit AWS Account ID, or pass --set global.awsAccountId=...
  ecrRegistry: ""  # Leave empty to auto-derive as <awsAccountId>.dkr.ecr.<awsRegion>.amazonaws.com, or leave both empty for Local/EC2
  tag: latest

mysql:
  enabled: true
  storage: 10Gi
  rootPassword: "RetailRootSecret2026!"
  username: "retail_user"
  password: "RetailAppSecret2026!"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1024Mi

redis:
  enabled: true
  storage: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

apiGateway:
  replicaCount: 2
  image:
    repository: retail/api-gateway
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi

productService:
  replicaCount: 2
  image:
    repository: retail/product-service
  service:
    type: ClusterIP
    port: 8081
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1024Mi

cartService:
  replicaCount: 2
  image:
    repository: retail/cart-service
  service:
    type: ClusterIP
    port: 8082
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi

orderService:
  replicaCount: 2
  image:
    repository: retail/order-service
  service:
    type: ClusterIP
    port: 8083
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1024Mi

frontend:
  replicaCount: 2
  image:
    repository: retail/frontend
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 75

ingress:
  enabled: true
  host: retail.yourdomain.com
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
