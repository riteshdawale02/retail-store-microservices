apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/part-of: retail-platform
data:
  CLOUD_PROVIDER: "AWS"
  AWS_REGION: {{ .Values.global.awsRegion | quote }}
  APP_ENV: {{ .Values.global.environment | quote }}
  SERVICES_PRODUCT_URL: "http://product-service:8081"
  SERVICES_CART_URL: "http://cart-service:8082"
  SERVICES_ORDER_URL: "http://order-service:8083"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/part-of: retail-platform
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ .Values.mysql.rootPassword | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.mysql.username | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.mysql.password | quote }}
