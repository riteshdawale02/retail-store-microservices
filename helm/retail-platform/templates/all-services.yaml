{{- $registry := "" -}}
{{- if .Values.global.ecrRegistry -}}
  {{- $registry = .Values.global.ecrRegistry -}}
{{- else if and .Values.global.awsAccountId .Values.global.awsRegion -}}
  {{- $accountId := printf "%v" .Values.global.awsAccountId -}}
  {{- if contains "e+" $accountId -}}
    {{- $accountId = printf "%.0f" (float64 .Values.global.awsAccountId) -}}
  {{- end -}}
  {{- $registry = printf "%s.dkr.ecr.%s.amazonaws.com" $accountId .Values.global.awsRegion -}}
{{- end -}}
{{- $tag := .Values.global.tag | default "latest" -}}
{{- $release := .Release.Name -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $release }}-api-gateway
  labels:
    app: api-gateway
spec:
  replicas: {{ .Values.apiGateway.replicaCount }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: "{{ if $registry }}{{ $registry }}/{{ end }}{{ .Values.apiGateway.image.repository }}:{{ $tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.apiGateway.service.port }}
          env:
            - name: SERVICES_PRODUCT_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ $release }}-config
                  key: SERVICES_PRODUCT_URL
            - name: SERVICES_CART_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ $release }}-config
                  key: SERVICES_CART_URL
            - name: SERVICES_ORDER_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ $release }}-config
                  key: SERVICES_ORDER_URL
            - name: CLOUD_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: {{ $release }}-config
                  key: CLOUD_PROVIDER
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: {{ $release }}-config
                  key: AWS_REGION
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ $release }}-config
                  key: APP_ENV
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.apiGateway.service.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.apiGateway.service.port }}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.apiGateway.service.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: {{ .Values.apiGateway.service.port }}
      targetPort: {{ .Values.apiGateway.service.port }}
  type: {{ .Values.apiGateway.service.type }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $release }}-product-service
  labels:
    app: product-service
spec:
  replicas: {{ .Values.productService.replicaCount }}
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z -w 2 mysql 3306; do echo "Waiting for MySQL..."; sleep 2; done; echo "MySQL ready!";']
      containers:
        - name: product-service
          image: "{{ if $registry }}{{ $registry }}/{{ end }}{{ .Values.productService.image.repository }}:{{ $tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.productService.service.port }}
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/retail_product_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $release }}-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $release }}-secrets
                  key: SPRING_DATASOURCE_PASSWORD
          resources:
            {{- toYaml .Values.productService.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.productService.service.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.productService.service.port }}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.productService.service.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  selector:
    app: product-service
  ports:
    - port: {{ .Values.productService.service.port }}
      targetPort: {{ .Values.productService.service.port }}
---
