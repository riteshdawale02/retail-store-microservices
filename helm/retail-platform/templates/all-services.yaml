{{- $registry := .Values.global.ecrRegistry -}}
{{- $tag := .Values.global.tag -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api-gateway
spec:
  replicas: {{ .Values.apiGateway.replicaCount }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: "{{ $registry }}/{{ .Values.apiGateway.image.repository }}:{{ $tag }}"
          ports:
            - containerPort: {{ .Values.apiGateway.service.port }}
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: {{ .Values.apiGateway.service.port }}
      targetPort: {{ .Values.apiGateway.service.port }}
  type: {{ .Values.apiGateway.service.type }}
---
