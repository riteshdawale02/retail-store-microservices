apiVersion: v1
kind: ConfigMap
metadata:
  name: retail-config
  namespace: retail-system
data:
  CLOUD_PROVIDER: "AWS"
  AWS_REGION: "us-east-1"
  APP_ENV: "production"
  SERVICES_PRODUCT_URL: "http://product-service:8081"
  SERVICES_CART_URL: "http://cart-service:8082"
  SERVICES_ORDER_URL: "http://order-service:8083"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: retail-secrets
  namespace: retail-system
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "RetailRootSecret2026!"
  SPRING_DATASOURCE_USERNAME: "retail_user"
  SPRING_DATASOURCE_PASSWORD: "RetailAppSecret2026!"
