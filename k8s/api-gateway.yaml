apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: retail-system
  labels:
    app: api-gateway
    tier: frontend-gateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: frontend-gateway
    spec:
      containers:
        - name: api-gateway
          image: 592306540354.dkr.ecr.us-east-1.amazonaws.com/retail/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SERVICES_PRODUCT_URL
              valueFrom:
                configMapKeyRef:
                  name: retail-config
                  key: SERVICES_PRODUCT_URL
            - name: SERVICES_CART_URL
              valueFrom:
                configMapKeyRef:
                  name: retail-config
                  key: SERVICES_CART_URL
            - name: SERVICES_ORDER_URL
              valueFrom:
                configMapKeyRef:
                  name: retail-config
                  key: SERVICES_ORDER_URL
            - name: CLOUD_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: retail-config
                  key: CLOUD_PROVIDER
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: retail-config
                  key: AWS_REGION
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: retail-config
                  key: APP_ENV
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: retail-system
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
